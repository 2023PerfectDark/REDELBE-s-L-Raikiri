; DEVELOPMENT TEMPLATE: parser tested; match playback is not connected yet.
; Paths are relative to this pack. Copy the referenced files into the pack.
; Specific opponents take precedence over '*'. Equal priority uses weight.
; Use the game's three-letter fighter codes. Intro character means speaker;
; Victory character means winner. Keep character = KAS for these Kasumi ports.
; Opponent lists expand who Kasumi addresses, not who performs her pose.
; opponent = AYA,HON uses the same line against Ayane or Honoka.
; opponent = * allows Kasumi to address any fighter.

