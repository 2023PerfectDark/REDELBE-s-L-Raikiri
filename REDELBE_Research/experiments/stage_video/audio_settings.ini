[StageVideoPreviews]
; Experimental preview audio. Restart the game after changing these options.
audio_enabled = true
; Preview audio volume, 0 to 100.
audio_volume = 100
; Music during audible previews: unchanged, lower, or mute.
; Game SE, System SE and Voices are not modified.
game_music_mode = lower
; Percentage of your normal music volume used in lower mode, 0 to 100.
; Your previous music level returns when preview audio stops.
game_music_percent = 20
