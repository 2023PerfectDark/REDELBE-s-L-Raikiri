[RandomMusic]
; Mode — UNAVAILABLE in LR
; THIS SECTION IS ONLY MEANINGFUL if enable_random_music = true in [Random] Otherwise, everything in here is ignored. ;;;;;;;; The mode. Currently, this can be one of these two values: mix and full mix -> the music will be randomized between the stage or character bgm, where the probability for the stage is given by "mix_stage_probability", and the probability for character music is 100 - mix_stage_probability full -> the music will be chosen randomly from the list in the file REDELBE/random_tracks.txt fullmix -> the music will be randomized based by character/stage from the list in the file REDELBE /fullmix.ini.
; Choices: mix, full, fullmix
mode = fullmix

; Stage probability — UNAVAILABLE in LR
; If mode is mix or fullmix, this is the probability that the stage theme will be chosen over the character theme. Please note that if the characters don't have a theme, this effectively becomes 100.
; Range: 0..100
stage_probability = 0

[Debug]
; Log mod resource access — LR SUPPORTED
; Log LR Layer2 overrides, Vanilla fallbacks, and resource redirects.
log_virtual = false

; Log loose resource opens — LR SUPPORTED
; Log opens of LR fdata_package/data resource files; not original DOA6 RDB semantics.
log_external = false

; Log archive container opens — LR SUPPORTED
; Log opens of LR packed archive containers (first 4,000 opens per run). Does not trace individual packed resource reads.
log_internal = false

; Log numeric — UNAVAILABLE in LR
; Logs access to the (mostly encrypted) .bin files in numeric folders (these are outside rdb filesystem) Unlike other log options, this one will be logged in every read attempt along with file position and number of bytes requested. Cost: irrelevant except when playing videos of story mode, where it would become low/average.
log_numeric = false

; Enable exception handler — UNAVAILABLE in LR
; ;;;;;;;;;; FROM HERE IT IS ADVANCED STUFF. DO NOT TOUCH IF YOU DON'T KNOW WHAT THESE SETTINGS MEAN ;;;;;;;;;;;;;; ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; Enables exception handler (will log a crash to the log file).
enable_exception_handler = false

; Enable cpp exception hook — UNAVAILABLE in LR
; If enabled, REDELBE will be able to print a C++ exception message to the log file, before the game does a "high level crash".
enable_cpp_exception_hook = false

; Cpp exception stack trace level — UNAVAILABLE in LR
; If enable_cpp_exception_hook=true, REDELBE will (try to) trace back this many calls when the exception happens.
; Range: 0..1000
cpp_exception_stack_trace_level = 3

; Dump keys — UNAVAILABLE in LR
; Encryption Dumps all AES256-CBC keys/IV to the log file.
dump_keys = false

; Dump all decrypted — UNAVAILABLE in LR
; Dumps all encrypted content after it has been decrypted. Data is stored in REDELBE/DECRYPTED.
dump_all_decrypted = false

; Auto uncompress decrypted — UNAVAILABLE in LR
; If true, and zlib data is detected after decryption, it will be automatically uncompressed before being dumped (this setting won't do anything unless dump_all_decrypted = true)
auto_uncompress_decrypted = true

; Debug script — UNAVAILABLE in LR
; Prints to the log the script calls to native functions (and only native), for debugging purposes. WARNING: this will cause a LOT of writes to the log file. It may slow down the game, specially on low spec systems. Also, the log file size will increase a lot, only enable this for short game sessiones (< 5 minutes).
debug_script = false

; Hunt hashes — UNAVAILABLE in LR
; It will print to the log the call to the string hash functions.
hunt_hashes = false

; Log UI animation events — LR SUPPORTED
; Verbose UI tracing. Normal startup, error, selection and roster-transition logs remain enabled.
log_ui_events = false

[Layer2]
; Costume Layer2 cycling — LR SUPPORTED
; Allow manual Layer2 costume selection.
enable_costume_cycling = true

; Hair/head Layer2 cycling — LR SUPPORTED
; Allow manual Layer2 hair/head selection in Accessories.
enable_hair_cycling = true

; Keyboard mod controls — LR SUPPORTED
; F cycles Layer2 mods.
keyboard_controls = true

; Gamepad mod controls — LR SUPPORTED
; LT/L2 cycles forward and Select/Back cycles backward.
gamepad_controls = true

[Branding]
; Show loader title label — LR SUPPORTED
; Display the loader name/version beside the game version.
enabled = true



