; REDELBE LR user settings. UTF-8. Restart the game after changes.
; true/false booleans; stable section/key names for launcher integrations.
; UNAVAILABLE legacy entries are retained for reference and have NO effect in LR.
; See settings.schema.json for labels, types, choices, bounds and availability.

[Uncensorship]
; Unrestricted break-blow close-ups — LR SUPPORTED
; For HON/MAR/NIC/SNK/MNT. Restart after changes.
uncensor_loli_blow = true

[Misc]
; Character slot and mod labels — LR SUPPORTED
; Show costume/hair slot codes and the selected Layer2 mod in character select.
slot_info_in_css = true

; Stage slot labels — LR SUPPORTED
; Show the highlighted stage code. Stage Layer2 is not yet ported; named stages show Mod: Vanilla. Restart after changes.
slot_info_in_sss = true

; Survival stage — UNAVAILABLE in LR
; This allow to set a different stage for survival mode. Default value is default game behavior (colosseum stage) The value can be a stage code -> Eg: survival_stage = S1601ISL It can also be a mod path -> Eg: survival_stage = "My Stage" If your stage is at a subfolder inside Layer2, then that folder name must also be specified -> E.g: survival_stage = "STAGES/My Stage" Special stage codes of REDELBE also work. Eg (to load colosseum night): survival_stage = S0401CLS
survival_stage = My Stage

; Disable splash — UNAVAILABLE in LR
; If true, the splash screen won't be shown.
disable_splash = false

[UI]
; F5 battle HUD toggle — LR SUPPORTED
; If enabled, the battle HUD can be toggled using F5 key.
enable_hide_battle_hud = true

; Custom roster animations — LR SUPPORTED
; true = custom roster animations, fade and hover reveal. false = original game roster animations and visibility. Restart after changing.
character_roster_transitions = true

; Accessories opens — LR SUPPORTED
; Choose the normal game transition or an instant roster change.
; Choices: native, instant
roster_accessories_exit = native

; Back from Accessories — LR SUPPORTED
; Choose the normal game transition or an instant roster change.
; Choices: native, instant
roster_accessories_return = native

; Player 1 ready → Player 2 selection — LR SUPPORTED
; Fade or instantly show the roster when Player 1 confirms.
; Choices: fade, instant
roster_handoff = fade

; Handoff fade duration (ms) — LR SUPPORTED
; Length of the Player 1 to Player 2 fade.
; Range: 100..10000
roster_fade_ms = 10000

; Reveal highlighted portrait during fade — LR SUPPORTED
; P2 cursor reveals its portrait; moving away hides it, then it fades back.
roster_hover_reveal = true

[Random]
; Random Layer2 costumes — LR SUPPORTED
; Include Layer2 costumes plus Vanilla in the game Random character selection, in offline Versus and Free Training.
enable_random_costume_mods = true

; Enable random underwear — UNAVAILABLE in LR
; if enabled, and the costume (either vanilla or mod) has alternative underwears, the underwear will be randomized in random selections (both player and cpu)
enable_random_underwear = true

; Enable random hair — UNAVAILABLE in LR
; If enabled, randomization will be applied to hair styles in random selections (both player and cpu). You can configure further options in [RandomHair]
enable_random_hair = true

; Enable random glasses — UNAVAILABLE in LR
; If enable, randmization will be applied to glasses in random selections (both player and cpu). You can configure further options in [RandomGlasses]
enable_random_glasses = false

; Enable random stage mods — UNAVAILABLE in LR
; If enabled, Layer2 stage mods will count towards random selection of stages (both randomness selected by player or cpu)
enable_random_stage_mods = true

; Enable random music — UNAVAILABLE in LR
; If enabled, music will be randomized following the rules at [RandomMusic] section
enable_random_music = false

[RandomHair]
; Probability — UNAVAILABLE in LR
; ;;;;;;;; THIS SECTION IS ONLY MEANINGFUL if enable_random_hair = true in [Random] Otherwise, everything in here is ignored. ;;;;;;;; This is the percentage that randomization will be applied to hair. If the probability evaluates to true, a random hair, from all available to current costume, will be selected, including the default hair of the current costume. If the probability evaluates to false, the default hair for that costume will be selected (default game behavior)
; Range: 0..100
probability = 35

; Allow mods — UNAVAILABLE in LR
; If true, hair mods will be included in the randomization. If false, they will be excluded.
allow_mods = true

[RandomGlasses]
; Probability — UNAVAILABLE in LR
; ;;;;;;;; THIS SECTION IS ONLY MEANINGFUL if enable_random_glasses = true in [Random] Otherwise, everything in here is ignored. ;;;;;;;; This is the percentage that randomization will be applied to glasses. For costumes without default glasses, this is the probability that a glasses from the list below will be chosen. For costumes with default glasses, this is the probability that a different glasses than default one will be chosen from the list below, and "no glasses" is also added to the random list in this case.
; Range: 0..100
probability = 25

; Kas — UNAVAILABLE in LR
; List of glasses for characters. When a random glass is chosen, it will be chosen from the list here. You can configure this list to your liking if you want X character to get glasses from other characters. Use a "," to separate multiple items
KAS = ITM_GLASSES_KAS_001, ITM_GLASSES_KAS_002, ITM_GLASSES_KAS_003

